name: Znect CI Bridge Cloudflare read-only diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: znect-ci-bridge-cloudflare-readonly
  cancel-in-progress: false

jobs:
  inspect-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Worker deployments and versions (no mutations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: znect-ci-bridge
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          request() {
            local endpoint="$1"
            local label="$2"
            local code
            code="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Accept: application/json" \
              "$endpoint")"
            echo "===== $label (HTTP $code) ====="
            jq 'if .success == true then
                  {success, errors, result}
                else
                  {success, errors, messages}
                end' "$tmp"
            [[ "$code" =~ ^2 ]] && jq -e '.success == true' "$tmp" >/dev/null
          }

          request "${api}/deployments" "Worker deployments"
          request "${api}/versions" "Worker versions"
