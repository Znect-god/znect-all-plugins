name: Znect CI Bridge checks

on:
  push:
    branches:
      - 'feature/znect-ci-bridge-source'
    paths:
      - 'plugins/znect-ci-bridge/**'
      - '.github/workflows/znect-ci-bridge.yml'
  pull_request:
    paths:
      - 'plugins/znect-ci-bridge/**'
      - '.github/workflows/znect-ci-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and Worker dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/znect-ci-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npx wrangler deploy --dry-run
