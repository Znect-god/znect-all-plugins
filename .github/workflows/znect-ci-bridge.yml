name: Znect CI Bridge checks

on:
  pull_request:
    paths:
      - "plugins/znect-ci-bridge/**"
      - ".github/workflows/znect-ci-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/znect-ci-bridge/**"
      - ".github/workflows/znect-ci-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: znect-ci-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, unit tests, and Worker dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/znect-ci-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/znect-ci-bridge/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck and unit tests
        run: npm run check
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run
