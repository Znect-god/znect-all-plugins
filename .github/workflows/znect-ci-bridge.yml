name: Znect CI Bridge checks

on:
  pull_request:
    paths:
      - 'plugins/znect-ci-bridge/**'
      - '.github/workflows/znect-ci-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Typecheck, tests, and Worker dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/znect-ci-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Commit generated lockfile to the Bridge branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/znect-ci-bridge-source'
        working-directory: .
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$GH_HEAD_REF"
          git checkout -B "$GH_HEAD_REF" "origin/$GH_HEAD_REF"
          git add plugins/znect-ci-bridge/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(znect-ci-bridge): add npm lockfile"
            git push origin "HEAD:refs/heads/$GH_HEAD_REF"
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test
      - run: npx wrangler deploy --dry-run
