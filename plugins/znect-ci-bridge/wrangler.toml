name = "znect-ci-bridge"
main = "src/index.ts"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]

# Secrets are added separately in Cloudflare. Never put tokens in this file.

# Approximate per-token limit: 60 MCP requests per 60 seconds per Cloudflare location.
# Choose a namespace_id unique within your Cloudflare account before deployment.
[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "2026111101"

  [ratelimits.simple]
  limit = 60
  period = 60

# Preview deployments use an isolated rate-limit namespace.
[[previews.ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "26111212026001"

  [previews.ratelimits.simple]
  limit = 60
  period = 60

# Durable event inbox for signed CircleCI workflow/job completion webhooks.
[[durable_objects.bindings]]
name = "EVENT_STORE"
class_name = "BuildEventStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BuildEventStore"]

# Preview environments need an explicit env binding; Cloudflare provisions
# an isolated SQLite-backed namespace for each Preview branch.
[[previews.durable_objects.bindings]]
name = "EVENT_STORE"
class_name = "BuildEventStore"
